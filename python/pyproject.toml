[project]
name = "lamu-trainer"
version = "0.1.0"
description = "Python deps for lamu-train trainer subprocess"
requires-python = ">=3.10"

# Pinned to versions verified against the lamu-train Rust contract
# as of 2026-05. Bump deliberately — major-version bumps in unsloth
# or trl frequently break the TrainerCallback hooks.
dependencies = [
    "unsloth>=2025.1,<2026.0",
    "trl>=0.13,<0.18",
    "peft>=0.14,<0.18",
    "bitsandbytes>=0.45",
    "transformers>=4.48,<5.0",
    "accelerate>=1.3",
    "torch>=2.5",
    "datasets>=3.0",
]

# APOLLO is wired via two paths in trainer.py:build_optimizer:
#   1. transformers builtin (post-PR #35225, transformers ≥ ~4.50)
#   2. fallback to the community `apollo-torch` package
# Either is acceptable. List it as optional so users who pin
# transformers older than the PR cut can still get APOLLO.
[project.optional-dependencies]
apollo = ["apollo-torch>=0.1"]

# MOVE-B (2026-05-29): the `lamquant.*` training/preprocessing tree
# (under python/lamquant/) imports the neural codec MODEL DEFINITIONS
# from the PRIVATE `lamquant-neural` wheel (encoder / blocks / snn /
# vocos_decoder / heads) and the PUBLIC `lamquant-core` PyO3 wheel (LMA
# decode). BLUT is PUBLIC; it declares these only as an OPTIONAL extra
# so the generic recipes (sft / dpo / distill) still install + run
# without them. Install the LamQuant recipes with:
#     pip install 'lamu-trainer[lamquant]'
# The lamquant.* modules degrade with a clear RuntimeError (see
# lamquant.require_lamquant_neural) when `lamquant-neural` is absent.
lamquant = [
    "lamquant-neural",   # PRIVATE — model defs (LamQuant-Neural repo)
    "lamquant-core",     # PUBLIC PyO3 — LMA/container decode (LamQuant-Lossless)
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Ship the MOVE-B training/preprocessing package tree. The legacy
# top-level trainer modules (trainer.py, trainer_dpo.py, …) are kept as
# loose py-modules so existing `$LAMU_TRAINER_PY` resolution is intact.
py-modules = ["trainer", "trainer_dpo", "trainer_distill", "datasets_loader"]

[tool.setuptools.packages.find]
# Discover the `lamquant` package (lamquant/, lamquant/snn/, …) that
# MOVE-B added under python/. Excludes the loose top-level modules.
include = ["lamquant*"]

[tool.lamu]
# Self-check mode is dependency-free (only stdlib). Used by Rust
# integration tests to verify the protocol round-trip without
# pulling the heavy install.
self_check_no_deps = true
