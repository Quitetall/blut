# SPDX-License-Identifier: AGPL-3.0-or-later
# blut-semantic — the ADR 0139 semantic-graph ADAPTER, a SIDECAR library.
#
# Bridges `blut-graph-core`'s compiled semantic graphs onto the engine's
# durable plan contracts. It lives OUTSIDE the engine because graph-core's
# node/port model carries ABIR's semantic type taxonomy (`AbirRootType`,
# `AbirViewType`, `port.abir`) — that is DOMAIN vocabulary, and the engine is
# domain-agnostic (ADR 0034). The dependency arrow therefore points INWARD:
# this crate depends on `blut`, never the reverse, so the lean engine carries
# no ABIR concepts and no graph-core code.
#
# Standalone workspace: a sidecar is deliberately not a member of the engine
# workspace (the engine never links it; it links the engine).
[workspace]

[package]
name = "blut-semantic"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "Semantic-graph adapter bridging blut-graph-core plans onto BLUT durable execution contracts (ADR 0139)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
blut = { path = "../.." }
blut-graph-core = { path = "../blut-graph-core" }
# Versions match the engine's so a workspace-unified build cannot diverge.
thiserror = "1"
serde_json = "1"

[dev-dependencies]
# The in-crate test stages implement the engine `Stage` trait.
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
