# blut-lamquant cookbook (TRANSITIONAL in-tree workspace member).
# Splits to its own repo `blut-lamquant` at C2c. Depends on the blut
# framework crate; will own the LamQuant recipes / stages / artifacts /
# backend + the python/lamquant payload once the atomic move (C2a) lands.
[package]
name = "cookbook-lamquant"
version = "0.1.0"
edition = "2024"
authors = ["Brian Lam"]
license = "MIT"
description = "LamQuant cookbook for BLUT — neural EEG codec training (encoder/oracle/SNN/decoder/joint) → PCCP gate."
rust-version = "1.85"

[lib]
path = "src/lib.rs"

# The user-facing `blut` binary lives here (blut-core is lib-only). It
# composes the cookbook registry and hands off to blut::cli.
[[bin]]
name = "blut"
path = "src/main.rs"

[dependencies]
blut = { path = "../.." }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Deps used by the moved LamQuant recipes / stages / artifacts /
# backend (versions match the blut crate). serde + schemars: typed Args
# (Serialize / Deserialize / JsonSchema). serde_json: manifest +
# RunManifest parsing. async-trait: the Stage impls. thiserror: stage
# error enums. tracing: stage progress. parking_lot: runner child-pid
# mutex. dirs: home-dir fallbacks. sha2: artifact fingerprints. which:
# script preflight.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
parking_lot = "0.12"
dirs = "5"
sha2 = "0.10"
which = "6"

[dev-dependencies]
# tokio is already a normal dependency (the bin uses it); tests inherit it.
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
