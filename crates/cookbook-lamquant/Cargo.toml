# blut-lamquant cookbook (TRANSITIONAL in-tree workspace member).
# Splits to its own repo `blut-lamquant` at C2c. Depends on the blut
# framework crate; will own the LamQuant recipes / stages / artifacts /
# backend + the python/lamquant payload once the atomic move (C2a) lands.
[package]
name = "cookbook-lamquant"
version = "0.1.0"
edition = "2024"
authors = ["Brian Lam"]
license = "MIT"
description = "LamQuant cookbook for BLUT — neural EEG codec training (encoder/oracle/SNN/decoder/joint) → PCCP gate."
rust-version = "1.85"

[lib]
path = "src/lib.rs"

# The user-facing `blut` binary lives here (blut-core is lib-only). It
# composes the cookbook registry and hands off to blut::cli.
[[bin]]
name = "blut"
path = "src/main.rs"

[dependencies]
blut = { path = "../.." }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]
# tokio is already a normal dependency (the bin uses it); tests inherit it.
tempfile = "3"
serde_json = "1"
nix = { version = "0.29", features = ["signal", "process"] }
