# Standalone crate, matching every other sidecar under `crates/`. The engine
# root declares an empty `[workspace]`, so a crate nested beneath it that is
# neither a member nor a path dependency of the root is in a state cargo
# refuses outright: "current package believes it's in a workspace when it's
# not". blut-graph-core was reachable only through blut-semantic's workspace
# and could not be built, checked, or formatted on its own from anywhere --
# which is what kept ADR 0142's `cargo fmt` gate red.

[workspace]

[package]
name = "blut-graph-core"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
publish = ["crates-io"]
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "Deterministic no_std compiler and execution contracts for capability-driven ABIR node graphs."
repository = "https://github.com/Quitetall/blut"
homepage = "https://github.com/Quitetall/blut"
documentation = "https://docs.rs/blut-graph-core"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md"]

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["serde/std", "blake3/std"]

[dependencies]
blake3 = { version = "1", default-features = false, features = ["pure"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
