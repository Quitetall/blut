# Standalone crate, matching every other sidecar under `crates/`. The engine
# root declares an empty `[workspace]`, so a crate nested beneath it that is
# neither a member nor a path dependency of the root is in a state cargo
# refuses outright: "current package believes it's in a workspace when it's
# not". blut-graph-core was reachable only through blut-semantic's workspace
# and could not be built, checked, or formatted on its own from anywhere --
# which is what kept ADR 0142's `cargo fmt` gate red.

[workspace]

[package]
name = "blut-graph-core"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
publish = ["crates-io"]
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "Deterministic no_std semantic compiler for capability-driven node graphs: kind-checks declared determinism, effect and partiality, fuses only where semantics are preserved, and lowers to an execution realm."
# No `repository`/`homepage`. The source repository is private, and a metadata
# link that 404s for every anonymous visitor is worse than no link: it reads as
# a dead project rather than a deliberately closed one. AGPL obligations are met
# by the published tarball, which carries the crate's complete source. Add the
# link when a public home exists -- crates.io takes updated metadata on any
# later version.
# crates.io facets. Absent until the 2026-08-26 domain-token migration: the crate was published describing
# itself as ABIR (biosignal) infrastructure, so it was neither discoverable as
# what it is nor honest about what it requires. It requires no domain at all.
keywords = ["dag", "compiler", "semantics", "pipeline", "no-std"]
categories = ["compilers", "no-std", "development-tools"]
documentation = "https://docs.rs/blut-graph-core"
readme = "README.md"
# Tests and examples SHIP. This crate is published so that a downstream
# open-source consumer (codec-lossless) can be built and verified by someone
# with no access to this repository -- and a crate whose test suite is withheld
# can be read but not checked, which is half of what "auditable" means. The
# subgraph-lowering test and the two evidence examples are the executable part
# of that story, and they cost ~5 KiB compressed.
#
# `/LICENSE` is NOT optional here. Setting `include` at all makes it an
# exhaustive allowlist, and cargo does not re-add the licence text for you --
# so the first draft of this list shipped an AGPL-3.0-or-later crate with no
# copy of the AGPL in the tarball. AGPL-3.0 section 4 requires giving every
# recipient a copy of the licence along with the program, and the `license =`
# field above does not satisfy that: it is an SPDX identifier for the crates.io
# index, not a distribution of the licence. The engine root carries the text but
# the root is outside this package, so it is copied in beside the crate.
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["serde/std", "blake3/std"]

[dependencies]
blake3 = { version = "1", default-features = false, features = ["pure"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
