[workspace]

[package]
name = "blut-dsl"
version = "0.1.0"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "BLUT Starlark front-end — evaluates a .star recipe to a PlanSpec JSON. Runs OUT OF PROCESS from the engine so starlark's serde_json/arbitrary_precision feature (which breaks the engine's internally-tagged enums via Cargo feature unification) never reaches the engine binary."

[[bin]]
name = "blut-dsl"
path = "src/main.rs"

[lib]
name = "blut_dsl"
path = "src/lib.rs"

[dependencies]
blut = { path = "../.." }
starlark = "0.14"
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
proptest = "1"
