[workspace]

[package]
name = "blut-operator"
version = "0.1.0"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "BLUT Kubernetes operator — BlutPlan / BlutWorkerPool CRDs + reconcilers. K8s is an adapter, not the control plane (ADR 0037)."

[[bin]]
name = "blut-operator"
path = "src/main.rs"

[dependencies]
kube = { version = "0.96", features = ["derive", "runtime", "client"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
