[workspace]

[package]
name = "blut-operator"
version = "0.2.0-alpha.2"
edition = "2024"
# The engine's MSRV.
rust-version = "1.99"
publish = ["crates-io"]
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/blut"
homepage = "https://github.com/Quitetall/blut"
documentation = "https://github.com/Quitetall/blut/blob/main/docs/OPERATOR.md"
description = "Kubernetes operator for BLUT: runs BlutPlan resources as Jobs and keeps BlutWorkerPool StatefulSets alive."
keywords = ["kubernetes", "operator", "ml", "orchestrator", "blut"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/deploy/**",
    "/Cargo.toml",
    "/Cargo.lock",
]

[[bin]]
name = "blut-operator"
path = "src/main.rs"

[dependencies]
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring", "derive", "runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
