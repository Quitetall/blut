[workspace]

[package]
name = "blut-worker"
version = "0.2.0-alpha.1"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "BLUT cloud worker agent — pulls jobs from a queue, executes DAGs, pushes results."

[[bin]]
name = "blut-worker"
path = "src/main.rs"

[dependencies]
blut = { path = "../..", version = "0.2.0-alpha.1" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"

[dev-dependencies]
tempfile = "3"
# oneshot() for exercising the router (auth middleware tests) in-process.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
