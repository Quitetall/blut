# SPDX-License-Identifier: AGPL-3.0-or-later
# blut-metrics (ADR 0097) — the telemetry SIDECAR: it tails the engine's
# status.jsonl telemetry records and serves a Prometheus/OpenMetrics `/metrics`
# scrape endpoint plus an OTLP span forwarder.
#
# It exists as a separate crate for one reason: the engine must never open a
# listening socket or an outbound collector connection (ADR 0034/0083). The
# engine WRITES records; this process owns every byte of network I/O. Reached
# as `blut metrics` via the ADR 0083 external-subcommand dispatch.
#
# Standalone workspace: a sidecar is deliberately not a member of the engine
# workspace (the engine never links it; it links blut-types only).
[workspace]

[package]
name = "blut-metrics"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "BLUT telemetry sidecar — OpenMetrics scrape endpoint and OTLP span forwarder over engine status records (ADR 0097)."
publish = false

[[bin]]
name = "blut-metrics"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# NOTE: blut-types ONLY — the sidecar never links the engine. It consumes the
# shared wire schema and reads files the engine already writes.
blut-types = { path = "../blut-types" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
