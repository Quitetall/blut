[package]
name = "blut-notify"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "BLUT notification sidecar — fail-closed custody boundary and sink delivery seam."
readme = "README.md"

[lib]
name = "blut_notify"
path = "src/lib.rs"

[[bin]]
name = "blut-notify"
path = "src/main.rs"

[dependencies]
blut-types = { path = "../blut-types", version = "0.2.0-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
