[package]
name = "blut-notify"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
publish = ["crates-io"]
authors = ["Brian Lam"]
license-file = "../../LICENSE"
description = "BLUT notification sidecar — durable rule routing with fail-closed custody boundaries."
repository = "https://github.com/Quitetall/blut"
homepage = "https://github.com/Quitetall/blut"
documentation = "https://docs.rs/blut-notify"
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md"]

[lib]
name = "blut_notify"
path = "src/lib.rs"

[[bin]]
name = "blut-notify"
path = "src/main.rs"

[dependencies]
blut-types = { path = "../blut-types", version = "=0.2.0-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
nix = { version = "0.31", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
