# blut-lamu cookbook (TRANSITIONAL in-tree workspace member).
# Splits to its own repo `blut-lamu` at C2c. The lamu tool's cookbook:
# generic-LLM training (SFT / DPO / distillation / eval) over the lamu +
# hf_trainer backends. Owns the 6 generic-LLM recipes + the `blut-lamu`
# binary; the stages / backends / artifacts the recipes wire stay in
# blut-core (engine primitives). Depends on the blut framework crate.
[package]
name = "cookbook-lamu"
version = "0.1.0"
edition = "2024"
authors = ["Brian Lam"]
license = "MIT"
description = "lamu cookbook for BLUT — generic LLM training (SFT/DPO/distill/eval) over llama.cpp + HuggingFace Trainer backends."
rust-version = "1.85"

[lib]
path = "src/lib.rs"

# The `blut-lamu` binary (distinct name from cookbook-lamquant's `blut`
# to avoid an install collision). Composes the lamu cookbook registry
# and hands off to blut::cli.
[[bin]]
name = "blut-lamu"
path = "src/main.rs"

[dependencies]
blut = { path = "../.." }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Deps used by the moved lamu recipes. serde + schemars: typed Args
# (Serialize / Deserialize / JsonSchema). serde_json: schema + args
# parsing. humantime: `finetune_from_conversations` parses the `since`
# duration string. async-trait: `dpo_from_preferences` defines an inline
# recipe-local Stage (`MaterializePreferences`). (The shared stages /
# backends / artifacts the recipes wire live in blut-core, so their deps
# are blut's, not ours.)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
humantime = "2"
async-trait = "0.1"
