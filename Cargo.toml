# blut — the domain-agnostic BLUT engine, a lib-only crate. Ships ZERO
# recipes and ZERO concrete cookbooks: only the framework (Stage / Plan /
# Recipe / Registry / Cookbook trait), the CLI / TUI orchestration, and
# the generic LLM stage / backend primitives. The cookbooks that supply
# recipes + the user-facing binaries are now SEPARATE repos depending on
# this crate (C2c): `blut-lamquant` (binary `blut`, neural EEG codec) and
# `blut-lamu` (binary `blut-lamu`, generic LLM). This crate still hosts
# the LamQuant python payload at `python/lamquant/` transitionally — it
# moves to blut-lamquant in migration #2, once the oracle frees it. See
# [[project_blut_cookbook_split]].
[package]
name = "blut"
version = "0.1.0"
edition = "2024"
authors = ["Brian Lam"]
license = "MIT"
repository = "https://github.com/Quitetall/blut"
rust-version = "1.85"
description = "BLUT — Brian Lam's Universal Trainer. Stage→Plan→Recipe orchestrator framework for local ML training (SFT, DPO, distillation, eval)."
readme = "README.md"
keywords = ["ml", "training", "fine-tune", "lora", "orchestrator"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "process"] }
dirs = "5"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
humantime = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
memmap2 = "0.9"
faster-hex = "0.10"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
schemars = "0.8"
tokio-util = "0.7"
rayon = "1"
which = "6"
bincode = "1.3"
rand = "0.8"
ratatui = "0.30"
crossterm = "0.28"
fuzzy-matcher = "0.3"
lerna = { git = "https://github.com/nbprint/lerna", rev = "a193def3064c9c8dca6f3153e2a4ae15ae59dcde", package = "lerna" }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "framework"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
