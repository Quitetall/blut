# blut — the domain-agnostic BLUT engine, a lib-only crate. Ships ZERO
# recipes, concrete stages, backends, or Python: only the framework
# (Stage / Plan / Recipe / Registry / Cookbook trait), the content-
# addressed cache, the never-OOM resource broker, HPO, lineage, and the
# CLI orchestration. Cookbooks that supply recipes + the user-facing
# binaries are SEPARATE crates depending on this one; the generic-LLM
# stages + backends live in `blut-backends`. The interactive TUI cockpit
# is behind the off-by-default `tui` feature (CLI-only in 1.0; returns in
# 1.1). See README.md / API.md.
[package]
name = "blut"
version = "0.11.0"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/blut"
homepage = "https://github.com/Quitetall/blut"
documentation = "https://docs.rs/blut"
rust-version = "1.85"
description = "BLUT — Brian Lam's Universal Trainer. Stage→Plan→Recipe orchestrator framework for local ML training (SFT, DPO, distillation, eval)."
readme = "README.md"
keywords = ["ml", "training", "fine-tune", "lora", "orchestrator"]
categories = ["command-line-utilities", "development-tools"]
# Trim the published package to the crate itself. NOTE: `scripts/` is KEPT —
# `src/config/launcher.rs` `include_str!`s `scripts/run_contained.sh` at compile
# time, so excluding it would break the build from a packaged tarball.
exclude = [
    "bench-baselines/",   # 92 Criterion baseline JSONs (~632 KB dev artifacts)
    ".github/",           # CI config — not useful to crate consumers
    "docs/",              # internal design specs
    "signatures/",        # CLA signature bookkeeping — not crate content
]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "process"] }
dirs = "5"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
humantime = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
memmap2 = "0.9"
faster-hex = "0.10"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
schemars = "0.8"
tokio-util = "0.7"
rayon = "1"
which = "6"
# Local-time quiet-hours (honours host TZ + DST). Minimal: no default
# features (drops the heavy `oldtime`/`serde`/`wasm` baggage), `clock`
# pulls only the local-tz lookup.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bincode = "1.3"
rand = "0.8"
# TUI deps — optional, behind the off-by-default `tui` feature. The 1.0
# release is CLI-only; the interactive cockpit returns (feature on / stabilized)
# in 1.1. With `tui` off these three are absent from the dependency tree.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }
fuzzy-matcher = { version = "0.3", optional = true }

[features]
default = []
# The interactive ratatui cockpit (`blut tui`, and bare `blut`). Off in 1.0
# (CLI-only); a cookbook binary opts in with `blut = { ..., features = ["tui"] }`.
tui = ["dep:ratatui", "dep:crossterm", "dep:fuzzy-matcher"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "framework"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
