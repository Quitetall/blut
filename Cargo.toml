# blut — the domain-agnostic BLUT engine, a lib-only crate. Ships ZERO
# recipes, concrete stages, backends, or Python: only the framework
# (Stage / Plan / Recipe / Registry / Cookbook trait), the content-
# addressed cache, memory-admission broker, HPO, lineage, and shared CLI
# orchestration. Cookbooks that supply recipes + the user-facing binaries
# are SEPARATE crates depending on this one; the generic-LLM stages +
# backends live in `blut-backends`; the interactive cockpit is the
# `crates/blut-tui` SIDECAR (ADR 0083 M2 — the engine carries no
# terminal-UI deps). See README.md / API.md.

# Standalone crate: declare our own (empty) workspace so the engine builds
# independently of whatever parent tree it's vendored or nested under (it lives
# as a submodule inside a larger meta-repo). Ignored when consumed as a
# crates.io dependency. Keeps `cargo build`/`publish` self-contained.
[workspace]

[package]
name = "blut"
version = "0.2.0-alpha.1"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/blut"
homepage = "https://github.com/Quitetall/blut"
documentation = "https://docs.rs/blut"
rust-version = "1.88"
publish = ["crates-io"]
description = "Typed DAG orchestration, caching, containment, and observability for ML training workflows."
readme = "README.md"
keywords = ["ml", "training", "fine-tune", "lora", "orchestrator"]
categories = ["asynchronous", "development-tools"]
# Fail-closed package surface. `scripts/run_contained.sh` is required because
# `src/config/launcher.rs` embeds it with `include_str!` at compile time.
include = [
    "/src/**",
    "/scripts/run_contained.sh",
    "/examples/**",
    "/tests/**",
    "/benches/framework.rs",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/API.md",
    "/EVENTING.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CLA.md",
    "/SECURITY.md",
    "/RELEASING.md",
    "/LICENSE",
    "/LICENSE.md",
]

[lib]
path = "src/lib.rs"

[dependencies]
# ADR 0083: the wasm32-safe keystone. The engine re-exports its types at their
# old paths, so this is zero-churn downstream.
blut-types = { path = "crates/blut-types", version = "=0.2.0-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
# "fs" is required by run_ledger.rs, which uses nix::fcntl::{Flock, FlockArg} to
# hold an advisory lock while appending. There is no "fcntl" feature in nix 0.29
# — the module is ungated but its CONTENTS sit behind "fs" (fcntl.rs:32,43) — so
# naming the module was the wrong guess and this is the right one.
#
# It was missing and nothing caught it, because the sibling crate blut-notify
# enables nix/fs and Cargo unifies features across a workspace build. `cargo
# test` here passed while `cargo check -p blut --lib` failed, and every
# DOWNSTREAM consumer (the cookbooks, codec-lossless, firmware) failed too. A
# feature a crate needs must be declared by that crate; borrowing it from a
# sibling only works until someone depends on you.
nix = { version = "0.29", features = ["signal", "process", "resource", "fs"] }
dirs = "7"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
humantime = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
memmap2 = "0.9"
faster-hex = "0.10"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
# `blut update` compares an installed version against the published one, and
# prereleases order backwards under string comparison. Already in the lockfile.
semver = "1"
schemars = "0.8"
tokio-util = "0.7"
rayon = "1"
which = "6"
# Local-filesystem object store used by the experimental cloud queue. Public
# preview excludes network providers until their XML dependency chain clears
# the advisory gate.
object_store = { version = "0.14", default-features = false, features = ["fs"], optional = true }
bytes = { version = "1", optional = true }
# Local-time quiet-hours (honours host TZ + DST). Minimal: no default
# features (drops the heavy `oldtime`/`serde`/`wasm` baggage), `clock`
# pulls only the local-tz lookup.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cron = "0.15"
bincode = "1.3"
rand = "0.8"
# P2P deps — optional, behind the `p2p` feature.
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
aes-gcm = { version = "0.10", optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
# Artifact content ids (framework/artifact.rs) hash with BLAKE3 on every build,
# so this is unconditional. It was already unconditional in practice — it just
# arrived transitively through abir-training, which made a CORE dependency look
# like a p2p extra.
blake3 = "1"
hkdf = { version = "0.12", optional = true }
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# X.509/SPKI parsing for PinnedVerifier (p2p/transport.rs) to extract a
# presented cert's SubjectPublicKeyInfo for pin comparison. Already resolved
# transitively — rustls's own "ring" feature enables "webpki/ring" — so this
# just exposes the existing dependency directly rather than hand-rolling a
# DER parser over attacker-controlled certificate bytes.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"], optional = true }
rcgen = { version = "0.13", optional = true }
[features]
# The cockpit moved to the `crates/blut-tui` sidecar (ADR 0083 M2); the lean
# CLI is now THE default build — no terminal-UI deps in the engine tree.
default = []
# P2P distributed compute — trust model, encryption, task dispatch.
p2p = ["dep:ed25519-dalek", "dep:aes-gcm", "dep:x25519-dalek", "dep:hkdf", "dep:quinn", "dep:rustls", "dep:webpki", "dep:rcgen"]
# Cloud compute queue (T3.1 / ADR 0082) — "submit a job, get the result back,
# billed on compute". Reuses the entire P2P data plane (bundle/verify, dispatch
# seam, trust matrix, peer-exec choreography, bundle-at-rest encryption) with an
# object store in place of QUIC, so it depends on `p2p`. Object-store transport
# is dev-testable on the local filesystem (no cloud account).
cloud = ["p2p", "dep:object_store", "dep:bytes"]
# Highly-available scheduler state (ADR 0106): an embedded Raft group
# replicating dispatch decisions so a coordinator crash cannot lose the
# in-flight table or re-dispatch running work. Depends on `p2p` because
# consensus rides the mesh as another authenticated frame — ADR 0034
# forbids a second transport or an in-engine HTTP service. Default-OFF:
# disabling it reverts to ADR 0079's single-driver scheduler, which is
# exactly the ADR's stated rollback.
raft = ["p2p"]

# NOTE (ADR 0078): the Starlark DSL is NOT a feature of this crate. `starlark`
# hard-depends on `serde_json/arbitrary_precision`, which Cargo feature
# unification would enable for the whole engine binary and silently break
# deserialization of the engine's internally-tagged enums (StatusUpdate /
# StageEvent / TrainSpec). The `.star` front-end therefore lives in a
# SEPARATE binary, `crates/blut-dsl`, that the engine shells out to; the
# engine consumes its output through the plain `.json` PlanSpec path.

[dev-dependencies]
tempfile = "3"
blut-notify = { path = "crates/blut-notify", version = "0.2.0-alpha.1" }
criterion = { version = "0.5", features = ["async_tokio"] }
# Property-based testing (ADR 0072 A7) — monotonicity / soundness / never-panics
# properties over random inputs, layered on top of the hand-written unit tests.
proptest = "1"

[[bench]]
name = "framework"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
