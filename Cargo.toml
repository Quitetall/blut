# blut — the domain-agnostic BLUT engine, a lib-only crate. Ships ZERO
# recipes, concrete stages, backends, or Python: only the framework
# (Stage / Plan / Recipe / Registry / Cookbook trait), the content-
# addressed cache, the never-OOM resource broker, HPO, lineage, the
# interactive TUI cockpit, and the CLI orchestration. Cookbooks that
# supply recipes + the user-facing binaries are SEPARATE crates depending
# on this one; the generic-LLM stages + backends live in `blut-backends`.
# The TUI cockpit ships in 1.0 (default-on `tui` feature); build with
# `--no-default-features` for a lean CLI-only binary. See README.md / API.md.

# Standalone crate: declare our own (empty) workspace so the engine builds
# independently of whatever parent tree it's vendored or nested under (it lives
# as a submodule inside a larger meta-repo). Ignored when consumed as a
# crates.io dependency. Keeps `cargo build`/`publish` self-contained.
[workspace]

[package]
name = "blut"
version = "1.0.0"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Quitetall/blut"
homepage = "https://github.com/Quitetall/blut"
documentation = "https://docs.rs/blut"
rust-version = "1.85"
description = "BLUT — Brian Lam's Universal Trainer. Stage→Plan→Recipe orchestrator framework for local ML training (SFT, DPO, distillation, eval)."
readme = "README.md"
keywords = ["ml", "training", "fine-tune", "lora", "orchestrator"]
categories = ["command-line-utilities", "development-tools"]
# Trim the published package to the crate itself. NOTE: `scripts/` is KEPT —
# `src/config/launcher.rs` `include_str!`s `scripts/run_contained.sh` at compile
# time, so excluding it would break the build from a packaged tarball.
exclude = [
    "bench-baselines/",   # 92 Criterion baseline JSONs (~632 KB dev artifacts)
    ".github/",           # CI config — not useful to crate consumers
    "docs/",              # internal design specs
    "signatures/",        # CLA signature bookkeeping — not crate content
]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "process", "resource"] }
dirs = "5"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
humantime = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
memmap2 = "0.9"
faster-hex = "0.10"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
schemars = "0.8"
tokio-util = "0.7"
rayon = "1"
which = "6"
# S3-compatible object store client (behind the `s3` feature). One dep covers
# S3/R2/GCS/MinIO. Client only — no HTTP-server surface.
object_store = { version = "0.11", features = ["aws"], optional = true }
bytes = { version = "1", optional = true }
# Local-time quiet-hours (honours host TZ + DST). Minimal: no default
# features (drops the heavy `oldtime`/`serde`/`wasm` baggage), `clock`
# pulls only the local-tz lookup.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
bincode = "1.3"
rand = "0.8"
# P2P deps — optional, behind the `p2p` feature.
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
aes-gcm = { version = "0.10", optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
blake3 = { version = "1", optional = true }
hkdf = { version = "0.12", optional = true }
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# X.509/SPKI parsing for PinnedVerifier (p2p/transport.rs) to extract a
# presented cert's SubjectPublicKeyInfo for pin comparison. Already resolved
# transitively — rustls's own "ring" feature enables "webpki/ring" — so this
# just exposes the existing dependency directly rather than hand-rolling a
# DER parser over attacker-controlled certificate bytes.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"], optional = true }
rcgen = { version = "0.13", optional = true }
# TUI deps — optional, behind the default-on `tui` feature. Building with
# `--no-default-features` drops these three from the dependency tree and
# yields a lean CLI-only binary.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }
fuzzy-matcher = { version = "0.3", optional = true }

[features]
default = ["tui"]
# The interactive ratatui cockpit (`blut tui`, and bare `blut`). On by default
# in 1.0; drop it with `blut = { ..., default-features = false }` for CLI-only.
tui = ["dep:ratatui", "dep:crossterm", "dep:fuzzy-matcher"]
# P2P distributed compute — trust model, encryption, task dispatch.
p2p = ["dep:ed25519-dalek", "dep:aes-gcm", "dep:x25519-dalek", "dep:blake3", "dep:hkdf", "dep:quinn", "dep:rustls", "dep:webpki", "dep:rcgen"]
# S3-compatible object store (S3/R2/GCS/MinIO) for the cache's remote tier
# (ADR 0067 T4.2). An object-store CLIENT — not an HTTP server — so it honors
# the ADR 0034 no-server charter (scope-guard verified). Non-default: the lean
# CLI and the firmware/no_std paths never pull it in.
s3 = ["dep:object_store", "dep:bytes"]

# NOTE (ADR 0078): the Starlark DSL is NOT a feature of this crate. `starlark`
# hard-depends on `serde_json/arbitrary_precision`, which Cargo feature
# unification would enable for the whole engine binary and silently break
# deserialization of the engine's internally-tagged enums (StatusUpdate /
# StageEvent / TrainSpec). The `.star` front-end therefore lives in a
# SEPARATE binary, `crates/blut-dsl`, that the engine shells out to; the
# engine consumes its output through the plain `.json` PlanSpec path.

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
# Property-based testing (ADR 0072 A7) — monotonicity / soundness / never-panics
# properties over random inputs, layered on top of the hand-written unit tests.
proptest = "1"

[[bench]]
name = "framework"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
