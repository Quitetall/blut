# Dependency updates.
#
# One `cargo` entry per WORKSPACE, not one for the repository. There are ten,
# each committing its own Cargo.lock, and an update to one does not touch the
# others. A single root entry would have left nine unwatched -- which is exactly
# how RUSTSEC-2026-0285 (rustls) came to sit in three lockfiles at once while
# everything looked green.
#
# Keep this list in step with `scripts/dependency_policy.sh`, which derives the
# same set from `git ls-files '*Cargo.lock'`. If that script audits a directory
# this file does not watch, the gate will keep catching drift by hand.
#
# cla.yml already allowlists dependabot[bot], so these PRs are not CLA-blocked.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # One PR for the routine churn; anything with an advisory still arrives
      # on its own so it is never buried in a batch.
      minor-and-patch:
        update-types: ["minor", "patch"]
