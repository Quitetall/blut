name: CLA Assistant

# Contributors grant rights under both the repo's open-source license and
# the OH! Tech LLC Enterprise License. See CLA.md in this repository:
# https://github.com/Quitetall/blut/blob/main/CLA.md
# Self-hosted (CLA Assistant Lite) — signatures stored in-repo.
#
# Security notes:
#   - Action pinned to full SHA (not mutable tag) to prevent supply-chain attacks.
#   - `actions: write` omitted — not required by contributor-assistant.
#   - `issue_comment` trigger scoped to PR comments only (github.event.issue.pull_request).
#   - Bot allowlist enumerates specific known bots; no wildcard bypass.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write       # store signature records in-repo
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE GUARD BELONGS ON THE JOB, NOT THE STEP.
    #
    # It used to sit on the step. A step-level `if` still starts the job: GitHub
    # allocates a runner, bills its per-job minimum of one minute, and only then
    # evaluates the condition and skips. Measured 2026-09-18: 207 CLA Assistant
    # runs in one day, 146 of them on `main` from issue comments that could
    # never have been a CLA signature -- closing 48 pull requests with a comment
    # was enough to trigger them. At the job level no runner is allocated at all.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        # Pinned to commit SHA for supply-chain safety; tag: v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/Quitetall/blut/blob/main/CLA.md'
          branch: 'main'
          # Enumerate specific bots — no wildcard bypass.
          allowlist: 'dependabot[bot],renovate[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA — thank you!'
          custom-notsigned-prcomment: |
            🚀 Thank you for your contribution, @${{ github.actor }}!

            Before we can review and merge your pull request, we need you to sign our lightweight Contributor License Agreement (CLA).

            The CLA is a **license grant, not a copyright assignment** — you keep full ownership of your work. It allows OH! Tech LLC to distribute your contribution under both the open-source license and a commercial Enterprise License.

            ✍️ **To sign:** read the [CLA Document](https://github.com/Quitetall/blut/blob/main/CLA.md), then post a comment on this PR containing exactly:

            > I have read the CLA Document and I hereby sign the CLA

            (Takes 30 seconds. You only sign once — all future PRs are remembered.)
