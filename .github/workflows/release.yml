# SPDX-License-Identifier: AGPL-3.0-or-later
# BLUT release train (ADR 0083 M6 / ADR 0137). Two deliberately separate paths:
#
#   * on a `v*` tag  → GATE (the release-critical CI suite) + BUILD the
#     sidecar binaries (blut-tui, blut-web, blut-operator, blut-notify) and
#     attach them to the GitHub Release.
#     This is automatic and reversible (a Release can be deleted / re-cut).
#
#   * workflow_dispatch with publish_crates=true → PUBLISH the crate chain to
#     crates.io in dependency order. This is MANUAL and owner-gated because a
#     crates.io publish is IRREVERSIBLE (a version can never be re-published).
#     It requires the CARGO_REGISTRY_TOKEN secret; without it the job refuses.
#
# The engine crate `blut` is lib-only; the runnable `blut`/`lqt` binary ships
# from a cookbook repo. The engine's own runnable artifacts are the sidecars.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_crates:
        description: "Publish the crate chain to crates.io (IRREVERSIBLE)"
        type: boolean
        default: false
      quiet_benchmark_sha:
        description: "Exact candidate SHA that passed scripts/run_benchmarks.sh compare on the designated quiet host"
        type: string
        default: ""

permissions:
  contents: write # attach binaries to the Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish mid-chain

jobs:
  # ── gate: the release candidate must pass release-critical CI ────────
  gate:
    name: release gate (release-critical CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Scope guard (ADR 0034 charter)
        run: bash scripts/scope_guard.sh
      - name: Format + check + clippy + test (workspace)
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
      - name: Public rustdoc (deny broken links and warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: wasm32 keystone (blut-types)
        run: cargo check --locked -p blut-types --target wasm32-unknown-unknown
      - name: First cookbook extension seam
        run: cargo run --locked --example first_cookbook
      - name: Compile framework benchmark harness
        run: cargo bench --locked -p blut --bench framework --no-run
      - name: Gate blut-dsl (standalone workspace)
        working-directory: crates/blut-dsl
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Gate blut-web (standalone workspace)
        working-directory: crates/blut-web
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # ADR 0097: the telemetry sidecar owns ALL network I/O for metrics —
      # the engine only writes records. Gate it or the OpenMetrics exposition
      # and the mesh trace-propagation proof rot.
      - name: Gate blut-metrics (standalone workspace)
        working-directory: crates/blut-metrics
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Gate blut-semantic (standalone workspace)
        working-directory: crates/blut-semantic
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Gate blut-tui (standalone workspace)
        working-directory: crates/blut-tui
        run: |
          cargo fmt --all -- --check
          cargo build --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          ./target/debug/blut-tui --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The BLUT 1.0 release catalog against this repository's manifests, this
      # repository's publish order and this workflow's own SBOM matrix,
      # checksum and dashboard-fallback fragments. This is the one place the
      # checker can pass, and therefore the one place it must: `ci.yml`'s
      # release-gates job proves it still runs, this proves the release is
      # actually in the state the catalog declares.
      #
      # The two components the release ships that are NOT in this repository --
      # blut-cookbook-standard and blut-cookbook-lamquant -- are declared
      # externals. Neither is checked out here, so the checker reports them
      # unchecked and this step BLOCKS. That is the correct verdict, not a
      # limitation to work around: publishing 1.0 means checking out both and
      # passing --external, and a release that could not name its own
      # components has not been validated. It arrived from
      # Quitetall/LamQuant on 2026-09-07 (LQ-WAR-0001 M4).
      - name: BLUT 1.0 release state
        run: python3 tools/check_blut_release_state.py --repo .

  # The operator intentionally has a newer MSRV than the public crate chain.
  # Gate it separately, then exercise its CRDs against a real API server.
  operator-gate:
    name: operator gate (Rust 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - name: Format + clippy + test blut-operator
        working-directory: crates/blut-operator
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  kind-smoke:
    name: kind CRD admission smoke
    needs: [gate, operator-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.89.0
      - name: Install pinned kind + kubectl
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          echo "a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind" | sha256sum -c -
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          echo "4f6a959dcc5b702135f8354cc7109b542a2933c46b808b248a214c1f69f817ea  /tmp/kubectl" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: CRD install + BlutPlan admission
        run: bash scripts/k8s_kind_smoke.sh

  # ── binaries: build the sidecars + attach to the Release (tag only) ──
  binaries:
    name: sidecar binaries (${{ matrix.crate }})
    needs: kind-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        crate: [blut-tui, blut-web, blut-operator, blut-notify]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          # The matrix includes blut-operator, whose deliberate MSRV is 1.89.
          # Rust 1.89 also builds the 1.88 public crates and sidecars.
          toolchain: 1.89.0
      # blut-tui / blut-web / blut-operator are standalone workspaces;
      # blut-notify is a member.
      - name: Build release binary
        run: |
          if [ -f "crates/${{ matrix.crate }}/Cargo.toml" ] && grep -q '^\[workspace\]' "crates/${{ matrix.crate }}/Cargo.toml"; then
            (cd "crates/${{ matrix.crate }}" && cargo build --release --locked)
            BIN="crates/${{ matrix.crate }}/target/release/${{ matrix.crate }}"
          else
            cargo build --release --locked -p "${{ matrix.crate }}"
            BIN="target/release/${{ matrix.crate }}"
          fi
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.crate }}-${{ github.ref_name }}-x86_64-linux"
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          files: dist/*

  # ── publish: the crate chain to crates.io, in dependency order ──────
  # MANUAL + owner-gated. blut-types → blut → blut-dsl → blut-notify. The
  # blut-web and blut-operator are publish=false and ship as the binaries above.
  # blut-tui is NOT: it is published (0.2.0-alpha.1 is on crates.io) and ships
  # both ways. It is not in this chain because the chain is the four crates the
  # release train publishes together.
  publish-crates:
    name: publish crate chain (IRREVERSIBLE)
    needs: kind-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io # a protected environment = a second human approval
    steps:
      - name: Require quiet-host benchmark evidence for this exact SHA
        env:
          QUIET_BENCHMARK_SHA: ${{ inputs.quiet_benchmark_sha }}
        run: |
          if [ "$QUIET_BENCHMARK_SHA" != "$GITHUB_SHA" ]; then
            echo "refusing publish: quiet_benchmark_sha must equal candidate $GITHUB_SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Refuse without a registry token (fail-closed)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is unset — refusing to publish."
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # The sparse index makes a just-published crate resolvable within
          # seconds; a short retry loop absorbs the residual lag so the next
          # crate in the chain verifies against the freshly-published dep.
          publish() {
            local pkg="$1"; shift
            echo "::group::publish $pkg"
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "$pkg" "$@"; then
                echo "::endgroup::"; return 0
              fi
              echo "publish $pkg attempt $attempt failed (dep may still be indexing) — retrying in 30s"
              sleep 30
            done
            echo "::error::failed to publish $pkg"; return 1
          }
          # blut-types is the ONLY chain root: blut depends on it, so it must
          # be indexed before blut packages ("no matching package named
          # `blut-types` found" otherwise).
          publish blut-types
          publish blut
          publish blut-dsl --manifest-path crates/blut-dsl/Cargo.toml
          publish blut-notify
          # blut-graph-core is INDEPENDENT of this chain: nothing in the train
          # depends on it since the ADR 0139 adapter moved to the (unpublished)
          # blut-semantic sidecar. Publish it on its own schedule once its
          # surface settles — it is the newest, fastest-moving crate here.
          # publish blut-graph-core
