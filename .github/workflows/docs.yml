# SPDX-License-Identifier: AGPL-3.0-or-later
# Build the mdBook docs site and deploy it to GitHub Pages (ADR 0083 M6). The
# book SOURCES the top-level docs via {{#include}} (book.toml / book_src), so a
# doc change on main re-publishes automatically with no copy to keep in sync.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "book.toml"
      - "book_src/**"
      - "README.md"
      - "API.md"
      - "RELEASING.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/DISTRIBUTED_VALIDATION.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.40"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Build the book
        run: mdbook build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
