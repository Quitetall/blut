name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly portability sweep. The macOS leg bills at 10x and exists to catch
  # portability drift, which weekly catches just as well as per-commit -- see
  # the `macos-build` job below.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # This job compiles EIGHT separate workspaces — the engine (three feature
      # combinations, all targets) plus blut-dsl, blut-notify, blut-web,
      # blut-web-ui on wasm32, blut-metrics, blut-semantic and blut-tui — each
      # with its own `target/`. A hosted runner ships ~14 GiB free, and the run
      # died partway through the wasm32 leg with "final link failed: No space
      # left on device". That is a capacity failure, not a code failure, and it
      # surfaces as a linker error deep in a dependency, which reads like a
      # broken toolchain until you get to the last line.
      #
      # Reclaiming the preinstalled SDKs this repository never uses buys ~20 GiB
      # for a few seconds of `rm`. Sizes are printed so a future squeeze is
      # visible in the log rather than inferred.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost || true
          echo "after:";  df -h / | tail -1

      - name: Install MSRV toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Cache cargo registry + git + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Charter enforcement (ADR 0034): the engine must not reimplement
      # delegated concerns (HTTP servers, GPU monitoring, plotting, log-agg,
      # process supervision). Sidecar crates (crates/*) are outside this
      # guard's scope by design. Runs first — it needs no toolchain.
      - name: Scope guard (ADR 0034 charter)
        run: bash scripts/scope_guard.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (all targets)
        run: cargo build --locked --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # P2P distributed compute is off-by-default; without an explicit gate
      # the entire src/p2p tree (and the executor's #[cfg(feature = "p2p")]
      # dispatch path) never compiles in CI and rots silently.
      - name: Clippy + test the p2p feature
        run: |
          cargo clippy --locked -p blut --features p2p --all-targets -- -D warnings
          cargo test --locked -p blut --features p2p

      # The cloud compute queue (ADR 0082) is off-by-default and implies p2p.
      # Gate clippy + the cloud tests (incl. the end-to-end loopback proof in
      # tests/cloud_integration.rs — local-fs object store, no cloud account)
      # so the src/cloud tree can't rot.
      - name: Clippy + test the cloud feature
        run: |
          cargo clippy --locked -p blut --features cloud --all-targets -- -D warnings
          cargo test --locked -p blut --features cloud --lib cloud
          cargo test --locked -p blut --features cloud --test cloud_integration

      # AUDIT 2026-07: every feature above is gated INDIVIDUALLY, but a real
      # cookbook binary unifies them. Cargo feature unification can break
      # combinations that each pass alone (the `serde_json/arbitrary_precision`
      # class the Cargo.toml warns about), so lint the FULL union once —
      # `cloud` is the complete set post-TUI-extraction (`cloud` implies `p2p`
      # + the object-store deps; the cockpit lives in crates/blut-tui now).
      # Clippy implies a full type-check; the per-feature jobs above already
      # run the tests.
      - name: Clippy the combined feature union (cloud ⊇ p2p)
        run: cargo clippy --locked -p blut --features cloud --all-targets -- -D warnings

      # crates/blut-dsl is a STANDALONE workspace (path-deps on the engine).
      # It links `starlark` — and its `serde_json/arbitrary_precision` feature
      # — which is exactly why it lives OUTSIDE the engine (ADR 0078). Gate it
      # explicitly so it can't rot.
      - name: Build + lint + test blut-dsl (standalone workspace)
        working-directory: crates/blut-dsl
        run: |
          cargo fmt --all -- --check
          cargo build --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps

      # ADR 0096: the notification boundary is a separate sidecar crate, and
      # its Restricted refusal is load-bearing enough to gate explicitly even
      # though the root workspace also discovers it through the acceptance test.
      - name: Build + lint + test blut-notify
        run: |
          cargo fmt -p blut-notify -- --check
          cargo build -p blut-notify --all-targets
          cargo clippy -p blut-notify --all-targets -- -D warnings
          cargo test -p blut-notify

      # ADR 0083 M2: the web sidecar is a STANDALONE workspace (path-deps on
      # the engine; the engine never links it). Gate it or the read-API +
      # fail-closed custody tests (401, loopback-only, restricted-export
      # tripwire) rot silently.
      - name: Build + lint + test blut-web (standalone workspace)
        working-directory: crates/blut-web
        run: |
          cargo fmt --all -- --check
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test

      # ADR 0083 M2: the Leptos dashboard type-checks + lints on wasm32 (the
      # trunk-less CI analogue of the blut-types keystone gate). Full bundling
      # (scripts/build_ui.sh) is a release/local step that needs the pinned
      # wasm-bindgen-cli; an API-only blut-web build embeds a stub page.
      - name: Check blut-web-ui (Leptos dashboard, wasm32)
        working-directory: crates/blut-web/ui
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --all -- --check
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      # ADR 0097: the telemetry sidecar owns ALL network I/O for metrics —
      # the engine only writes records. Gate it or the OpenMetrics exposition
      # and the mesh trace-propagation proof rot.
      - name: Build + lint + test blut-metrics (standalone workspace)
        working-directory: crates/blut-metrics
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # ADR 0139 / ADR 0034: the semantic-graph adapter is a SIDECAR (standalone
      # workspace) so the domain-agnostic engine carries no ABIR vocabulary and
      # no blut-graph-core code. Gate it or the adapter rots.
      - name: Build + lint + test blut-semantic (standalone workspace)
        working-directory: crates/blut-semantic
        run: |
          cargo fmt --all -- --check
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test

      # ADR 0083 M2: the cockpit is the blut-tui SIDECAR (standalone
      # workspace) — the engine ships zero terminal-UI deps. Gate the build,
      # the 76 state/harness tests, AND the headless `--check` (renders every
      # view to a test backend) so the extraction can't rot.
      - name: Build + lint + test blut-tui (standalone workspace)
        working-directory: crates/blut-tui
        run: |
          cargo fmt --all -- --check
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test
          ./target/debug/blut-tui --check

      - name: Rustdoc (deny broken public docs)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Staged public package surface and tarballs
        run: |
          cargo package --locked --list > /tmp/blut-package.txt
          ! grep -E '^(\.claude/|docker/|docs/|scripts/(k8s_kind|minio)_smoke\.sh)' /tmp/blut-package.txt
          cargo publish --dry-run --locked --manifest-path crates/blut-types/Cargo.toml
          cargo package --locked --list --manifest-path crates/blut-dsl/Cargo.toml > /tmp/blut-dsl-package.txt
          if cargo info blut-types@0.2.0-alpha.1 >/dev/null 2>&1; then
            cargo package --locked
          else
            echo "::notice::blut tarball verification awaits blut-types 0.2.0-alpha.1 indexing; rerun this exact SHA after publishing blut-types"
          fi
          if cargo info blut@0.2.0-alpha.1 >/dev/null 2>&1; then
            cargo package --locked --manifest-path crates/blut-dsl/Cargo.toml
          else
            echo "::notice::blut-dsl tarball verification awaits blut 0.2.0-alpha.1 indexing; rerun this exact SHA after publishing blut"
          fi

      - name: In-tree public example smoke
        run: cargo run --locked --example first_cookbook

  sdk-parity:
    name: blut-sdk parity gate (ADR 0111)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ADR 0111's Validation section names the specific way this decision rots:
    # the SDK mirrors the PlanSpec v1 IR, and if the two drift in the field
    # without a compat entry the parity gate has rotted. Arming it here is what
    # makes that impossible to do quietly — the SDK lives in this repo so an IR
    # change and this job fail in the same commit.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: stable

      # Build the Starlark front-end so the gate compares against TODAY's
      # blut-dsl, not only the checked-in golden. Without it the gate still
      # runs and still catches a builder that drifted from the fixture, but it
      # cannot notice a fixture that has gone stale against the emitter.
      - name: Build blut-dsl (the parity counterpart)
        run: cargo build --locked --release --manifest-path crates/blut-dsl/Cargo.toml

      - name: Install the SDK
        working-directory: sdk
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Unit tests
        working-directory: sdk
        run: python -m pytest tests -q

      - name: Parity gate
        working-directory: sdk
        run: |
          output=$(python -m blut_sdk.tests.parity)
          echo "$output"
          # The gate exits non-zero on failure, but a SKIPped live-DSL check
          # would still exit 0 — and a silently skipped check is how a gate
          # becomes vacuous. blut-dsl was just built, so a SKIP here means the
          # discovery path broke and the comparison is no longer running.
          if echo "$output" | grep -q "SKIP  fixture vs live blut-dsl"; then
            echo "::error::live blut-dsl comparison was skipped despite the binary being built"
            exit 1
          fi

      # NOT covered here, stated so nobody reads this job as broader than it
      # is: the gate's second half — `blut recipe declare <plan>` compiling an
      # SDK-authored plan through `from_erased_graph` — needs a COOKBOOK. This
      # repo's engine registers no stages of its own, so a bare `blut` would
      # reject the example's every node for the same reason a correct plan and
      # a typo'd one both fail against an empty registry. That half runs
      # against a cookbook binary (`lqt`) and is recorded in ADR 0111's
      # Completion block. What is checked here is that the example still emits
      # a well-formed v1 plan of the expected shape.
      - name: Example emits a well-formed plan
        working-directory: sdk
        run: |
          plan=$(python -m blut_sdk.examples.fanout --emit "$RUNNER_TEMP/sdk_plan.json")
          test -s "$plan"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['version']==1; assert len(d['nodes'])==5" "$plan"

  operator-internal:
    name: unpublished operator · Rust 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install operator MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - name: Gate unpublished operator
        working-directory: crates/blut-operator
        run: |
          cargo fmt --all -- --check
          cargo build --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  macos-build:
    name: macOS compile-check (containment degrades)
    # WEEKLY, not per-commit. macOS bills at 10x, and this job ran on every
    # push to main AND every pull request -- the single most expensive lane in
    # the fleet, for a check that only proves the crate still COMPILES on a
    # non-Linux Unix host. Compile-portability drifts on the timescale of
    # dependency and edition changes, not individual commits, so a weekly
    # sweep catches it at roughly a twentieth of the billed minutes.
    # Force one on a branch: `gh workflow run ci.yml --ref <branch>`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    # blut is a Linux-first engine: the never-OOM cgroup containment needs
    # Linux + systemd, and off-systemd it degrades to a bare spawn. This job
    # only proves the crate COMPILES on a non-Linux Unix host (the realistic
    # `cargo add blut` target) — it does not run the systemd-dependent tests.
    # Build-only (no `-D warnings`) so a macOS-specific lint can't mask the
    # compile signal.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: 1.88.0
      - name: Cache cargo registry + git + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build (lib + all targets)
        run: cargo build --locked --workspace --all-targets

  wasm32-keystone:
    name: blut-types wasm32 keystone (ADR 0083)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ADR 0083: `blut-types` is the wasm32-SAFE keystone crate — the pure-serde
    # wire types shared by the engine and the Leptos+WASM `blut-web` sidecar. It
    # must NEVER pull in tokio / rusqlite / filesystem / an engine dep, or the
    # browser UI can't depend on it. This job is the fail-closed guard: a PR that
    # adds a non-wasm dependency to blut-types breaks the `wasm32-unknown-unknown`
    # check here before it can reach main.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install MSRV toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry + git + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Check blut-types on wasm32-unknown-unknown
        run: cargo check --locked -p blut-types --target wasm32-unknown-unknown
      - name: blut-types host tests
        run: cargo test --locked -p blut-types

  security:
    name: advisories · licenses · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: 1.88.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Dependency policy
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path crates/blut-dsl/Cargo.toml --config deny.toml check
          cargo deny --locked --manifest-path crates/blut-operator/Cargo.toml --config deny.toml check
      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
