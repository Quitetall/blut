name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test-lint:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Charter enforcement (ADR 0034): the engine must not reimplement
      # delegated concerns (HTTP servers, GPU monitoring, plotting, log-agg,
      # process supervision). Sidecar crates (crates/*) are outside this
      # guard's scope by design. Runs first — it needs no toolchain.
      - name: Scope guard (ADR 0034 charter)
        run: bash scripts/scope_guard.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (all targets)
        run: cargo build --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The cockpit's `tui` feature is default-on since 1.0, but pin it
      # explicitly so a future change to the default feature set can't
      # silently drop the cockpit from CI coverage.
      - name: Clippy + test the tui feature
        run: |
          cargo clippy -p blut --features tui --all-targets -- -D warnings
          cargo test -p blut --features tui

      # P2P distributed compute is off-by-default; without an explicit gate
      # the entire src/p2p tree (and the executor's #[cfg(feature = "p2p")]
      # dispatch path) never compiles in CI and rots silently.
      - name: Clippy + test the p2p feature
        run: |
          cargo clippy -p blut --features p2p --all-targets -- -D warnings
          cargo test -p blut --features p2p

      # The S3 object-store backend is off-by-default (it pulls the
      # object_store client + a TLS stack). Gate build + clippy so the
      # #[cfg(feature = "s3")] S3BlobStore + async bridge can't rot. The MinIO
      # round-trip test is #[ignore]d (needs an endpoint) — run via
      # scripts/minio_smoke.sh, not here.
      - name: Clippy + build the s3 feature
        run: |
          cargo clippy -p blut --features s3 --all-targets -- -D warnings
          cargo test -p blut --features s3 --lib object_store --no-run

      # The cloud compute queue (ADR 0082) is off-by-default and implies p2p.
      # Gate clippy + the cloud tests (incl. the end-to-end loopback proof in
      # tests/cloud_integration.rs — local-fs object store, no cloud account)
      # so the src/cloud tree can't rot.
      - name: Clippy + test the cloud feature
        run: |
          cargo clippy -p blut --features cloud --all-targets -- -D warnings
          cargo test -p blut --features cloud --lib cloud
          cargo test -p blut --features cloud --test cloud_integration

      # crates/blut-dsl is a STANDALONE workspace (path-deps on the engine).
      # It links `starlark` — and its `serde_json/arbitrary_precision` feature
      # — which is exactly why it lives OUTSIDE the engine (ADR 0078). Gate it
      # explicitly so it can't rot.
      - name: Build + lint + test blut-dsl (standalone workspace)
        working-directory: crates/blut-dsl
        run: |
          cargo fmt --all -- --check
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test

      # crates/blut-worker is a STANDALONE workspace (it path-depends on the
      # engine but is not a member of the root [workspace]), so none of the
      # --workspace steps above touch it. Gate it explicitly or it rots
      # silently — the framework bench already demonstrated that failure mode.
      - name: Build + lint + test blut-worker (standalone workspace)
        working-directory: crates/blut-worker
        run: |
          cargo fmt --all -- --check
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test

      # crates/blut-operator is a STANDALONE workspace (kube-rs + k8s-openapi
      # live ONLY here — the engine has zero kube dep, ADR 0037). Gate it or the
      # CRD derives / reconcilers rot silently. The kind/MinIO end-to-end smoke
      # is a separate, heavier job (not per-PR).
      - name: Build + lint + test blut-operator (standalone workspace)
        working-directory: crates/blut-operator
        run: |
          cargo fmt --all -- --check
          cargo build --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test

  macos-build:
    name: macOS compile-check (containment degrades)
    runs-on: macos-latest
    # blut is a Linux-first engine: the never-OOM cgroup containment needs
    # Linux + systemd, and off-systemd it degrades to a bare spawn. This job
    # only proves the crate COMPILES on a non-Linux Unix host (the realistic
    # `cargo add blut` target) — it does not run the systemd-dependent tests.
    # Build-only (no `-D warnings`) so a macOS-specific lint can't mask the
    # compile signal.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build (lib + all targets)
        run: cargo build --workspace --all-targets

  wasm32-keystone:
    name: blut-types wasm32 keystone (ADR 0083)
    runs-on: ubuntu-latest
    # ADR 0083: `blut-types` is the wasm32-SAFE keystone crate — the pure-serde
    # wire types shared by the engine and the Leptos+WASM `blut-web` sidecar. It
    # must NEVER pull in tokio / rusqlite / filesystem / an engine dep, or the
    # browser UI can't depend on it. This job is the fail-closed guard: a PR that
    # adds a non-wasm dependency to blut-types breaks the `wasm32-unknown-unknown`
    # check here before it can reach main.
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Check blut-types on wasm32-unknown-unknown
        run: cargo check -p blut-types --target wasm32-unknown-unknown
      - name: blut-types host tests
        run: cargo test -p blut-types
