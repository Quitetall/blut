name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test-lint:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (all targets)
        run: cargo build --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The interactive cockpit is behind the off-by-default `tui` feature
      # (1.0 is CLI-only). Lint + test it explicitly so the gated code can't
      # bitrot before it's re-enabled in 1.1.
      - name: Clippy + test the tui feature
        run: |
          cargo clippy -p blut --features tui --all-targets -- -D warnings
          cargo test -p blut --features tui

  macos-build:
    name: macOS compile-check (containment degrades)
    runs-on: macos-latest
    # blut is a Linux-first engine: the never-OOM cgroup containment needs
    # Linux + systemd, and off-systemd it degrades to a bare spawn. This job
    # only proves the crate COMPILES on a non-Linux Unix host (the realistic
    # `cargo add blut` target) — it does not run the systemd-dependent tests.
    # Build-only (no `-D warnings`) so a macOS-specific lint can't mask the
    # compile signal.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build (lib + all targets)
        run: cargo build --workspace --all-targets
